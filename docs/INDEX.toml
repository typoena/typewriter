# Knowledge index for docs/ — machine-first, one read, no folder browsing.
#
# Purpose: answer "which single file holds the answer to X" without opening
# anything else. `docs/README.md` is the human map (what each tree is for);
# this is the retrieval map (what each file concludes, and about what).
#
# Every entry carries `path` — the provenance. A claim here that cannot be
# traced back to its file does not belong here.
#
# Maintenance: an entry earns its place only if it states a *conclusion* a
# grep over the repo would not produce. Add a `holds` line when a doc lands a
# number, a decision or a refutation; drop the entry when the file goes.

schema = 1

