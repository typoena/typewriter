# ADRs — all in docs/adr.md; anchor is the section slug.

[[adr]]
id = "ADR-001"
title = "Language and runtime — Rust on esp-idf-rs (std)"
status = "Accepted"
nodes = ["architecture"]

[[adr]]
id = "ADR-002"
title = "UI strategy — custom widgets on embedded-graphics, not Ratatui"
status = "Accepted"
nodes = ["render", "epd"]

[[adr]]
id = "ADR-003"
title = "Display medium — e-ink (GDEY0579T93)"
status = "Accepted"
nodes = ["epd", "render", "power"]
holds = "~13-line writing column; ~27 KB framebuffer; per-keystroke latency floor ~100-300 ms; scroll is the worst-case refresh op; renderer kept resolution-agnostic for a 10.3\" upgrade."

[[adr]]
id = "ADR-004"
title = "Git implementation — gitoxide (gix)"
status = "Accepted, kill-switch fired"
nodes = ["git-sync"]
holds = "gix pushes only over file:// and ssh://, not HTTP(S) — fallback to libgit2 taken for v0.1."

[[adr]]
id = "ADR-005"
title = "Auth — HTTPS + GitHub Personal Access Token"
status = "Accepted"
nodes = ["git-sync", "onboarding"]

[[adr]]
id = "ADR-006"
title = "Concurrency — std::thread + channels, no async runtime"
status = "Accepted"
nodes = ["architecture"]
holds = "Five tasks (usb, wifi, ui, render, git); editor state behind one Mutex; revisit past ~10 tasks."

[[adr]]
id = "ADR-007"
title = "Storage split — FAT-on-SD for working copy, LittleFS-on-flash for config"
status = "Accepted; config half never built"
nodes = ["sd", "config"]
holds = "FatFS f_rename does not overwrite — unlink target first, plus boot recovery with a two-case decision table. Config lives in plaintext /sd/typoena.conf, not LittleFS. Use a genuine SD card, ideally <=32 GB SDHC."

[[adr]]
id = "ADR-008"
title = "MVP power — wall-powered, battery deferred"
status = "Accepted"
nodes = ["power"]

[[adr]]
id = "ADR-009"
title = "Keyboard transport — USB host (TinyUSB)"
status = "Accepted"
nodes = ["keyboard"]
holds = "BLE-HID rejected: shares the 2.4 GHz radio with Wi-Fi, so a push would contend with input."

[[adr]]
id = "ADR-010"
title = "Push UX — one gesture, auto-timestamp message, no prompt"
status = "Accepted; mechanics drifted"
nodes = ["git-sync"]
holds = "Trigger is :gs (not Ctrl-G); message is 'Typoena push — unix <epoch>'; rejected pushes replay onto the remote tip — no merge commits."

[[adr]]
id = "ADR-011"
title = "Credential provisioning — how the PAT reaches the device and is protected at rest"
status = "Open"
nodes = ["onboarding", "config"]
holds = "Delivery solved (GitHub App device flow writes /sd/typoena.conf, nothing baked into the image). At-rest encryption unbuilt — plaintext on a removable FAT card."

[[adr]]
id = "ADR-012"
title = "SD on its own SPI3 host (not shared with the EPD on SPI2)"
status = "Accepted"
nodes = ["sd", "epd"]
holds = "SpiBusDriver holds an exclusive bus lock for its whole lifetime, locking out any other device on SPI2. Pins — SD/SPI3: SCK 14, MOSI 15, MISO 13, CS 10. EPD/SPI2: SCK 12, MOSI 11, CS 7, DC 6, RST 5, BUSY 4."

[[adr]]
id = "ADR-013"
title = "Firmware architecture — adopt the hexagonal ports refactor"
status = "Accepted"
nodes = ["architecture"]
holds = "main.rs 924 -> 368 lines; 358 green host tests; Wi-Fi deliberately left unported (fused with git sync); the two esp-idf binaries stay outside the workspace by design."

