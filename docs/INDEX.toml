# Record — dated, append-only. This is where measured constants live.

[[doc]]
path = "docs/record/postmortems/2026-07-05-spike3-sd-cmd59.md"
nodes = ["sd"]
holds = "Counterfeit/large SDXC cards reject CMD59 (SPI-mode CRC) and fail to mount. Decision: keep CRC required, report a swap-the-card message. Also the FatFS f_rename / atomic-save recovery table."

[[doc]]
path = "docs/record/postmortems/2026-07-05-spike7-gix-https-push.md"
nodes = ["git-sync"]
holds = "The ADR-004 kill-switch. libgit2 compiles and links on xtensa (Gate A + B), on-device push completed 2026-07-06, and the three bugs between 'links and runs' and 'pushes'."

[[doc]]
path = "docs/record/postmortems/2026-07-11-editor-freeze-spi-dma-oom-during-sync.md"
nodes = ["epd", "git-sync", "render"]
holds = "SPI-DMA out-of-memory during a background :sync froze the editor. Shipped remediation: paints are non-fatal. Root-cause eradication specced, not built."

[[doc]]
path = "docs/record/postmortems/2026-07-16-gate-scan-spike-refuted.md"
nodes = ["epd"]
holds = "REFUTED: partial waveform time is MUX-independent — restricting the gate scan buys nothing. Do not retry. The remaining lever is a custom LUT."

[[doc]]
path = "docs/record/postmortems/2026-07-16-partial-refresh-bank-toggle.md"
nodes = ["epd"]
holds = "Mode-2 ping-pong vs a one-bank resync left one RAM bank two frames stale. Refresh cadence was the wrong turn; the trace pinned the bank toggle."

[[doc]]
path = "docs/record/postmortems/2026-07-20-wizard-wifi-loadprohibited.md"
nodes = ["onboarding", "wifi"]
holds = "Wi-Fi bring-up boot loop (LoadProhibited) in the onboarding wizard. Fixed and verified on device; the fix is a firmware/Cargo.toml change. Six device flashes to find it."

[[doc]]
path = "docs/record/kaizen/cold-boot-time.md"
nodes = ["boot"]
holds = "Chosen levers: disable PSRAM memtest + CPU at 240 MHz, in the sdkconfig.defaults boot-time block; the file walk moved off the boot hot path. QIO rejected — brick risk outweighs ~0.1 s."

[[doc]]
path = "docs/record/kaizen/real-repo-sync.md"
nodes = ["git-sync", "sd"]
holds = "Closed 2026-07-13: first end-to-end :sync on the real repo. Chosen idea was the O(depth) TreeBuilder splice with fast-seek as its config."

[[doc]]
path = "docs/record/tradeoff-curves/epd-refresh-latency.md"
nodes = ["epd", "render"]
holds = "Refresh latency vs rows driven, and the closed experiment log on the ~540 ms floor: temperature is not a lever (CLOSED); SPI clock sweep; set_ram_area settle delay 0 ms shipped (windowed ~495 ms, full-area ~527 ms); custom 0x32 LUT with FR sweep, 0x08 kept; charge-pump keep-hot reverted, no win; fast_partial ghost accumulation v6 confirmed on device 2026-07-25; eviction must precede the RAM writes. Async partial CLOSED 2026-07-17, not worth building."

[[doc]]
path = "docs/record/tradeoff-curves/sync-commit-staging.md"
nodes = ["git-sync", "sd"]
holds = "Why the git index is the wrong primitive at real-repo scale, and the root cause behind it: FatFS lseek walks the cluster chain. Verdict: the sub-second bar FAILED, wire the O(depth) splice in anyway. Includes how to bench and flash git_bench."

[[doc]]
path = "docs/record/tradeoff-curves/wifi-auto-sync.md"
nodes = ["wifi", "power"]
holds = "auto_sync read as a max-staleness cap, not a timer. Default 10 min (3.6 vs 7.2 mAh/hr at 5 min), minimum clamped to ~2 min. Push when awake + dirty and once on the way into sleep; never wake from deep sleep purely to sync."

[[doc]]
path = "docs/record/notes/boot-time-budget.md"
nodes = ["boot", "epd"]
holds = "~4.26 s to cursor. The ~1.9 s full-refresh floor is the wall; PSRAM memtest off buys -0.73 s. <= 3 s (the v1.0 target) is marginal-to-unreachable on this panel — <= 3.5 s is the achievable target."

[[doc]]
path = "docs/record/notes/ctrl-g-perceived-latency.md"
nodes = ["git-sync", "render"]
holds = "Durability before delivery: the moment that matters is the local commit (~0.2 s), not push completion (5-10 s). Surfacing it collapses perceived latency."

[[doc]]
path = "docs/record/notes/sync-latency.md"
nodes = ["git-sync", "wifi"]
holds = "~16 s cold / ~10 s warm :gs, close to the floor. The win was one TLS handshake instead of two. Foreign pushes reconcile-and-replay, last-writer-wins."

[[doc]]
path = "docs/record/notes/epd-waveforms.md"
nodes = ["epd"]
holds = "Conceptual primer: what happens in a pixel, why a waveform is a timed voltage recipe, why it is a LUT table, full vs partial vs fast, why temperature is in the mix."

[[doc]]
path = "docs/record/notes/epd-waveform-lut-deep-dive.md"
nodes = ["epd"]
holds = "SSD1683 LUT bit-packing byte by byte — the VS region is 60 bytes = 5 LUTs x 12 phases — our actual bytes decoded, and what a proper white-to-black partial should look like."

[[doc]]
path = "docs/record/notes/git-sync-images-and-repo-size.md"
nodes = ["git-sync", "sd"]
holds = "Decision: do not shrink the notes repo. Why shrinking is off the table, what an ongoing pull actually costs, and the increment-C fix landed 2026-07-14."

